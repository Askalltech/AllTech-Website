name = "alltech-website"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

routes = [
  { pattern = "development-preview.askalltech.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

# Environment variables set in the Worker's dashboard, not committed:
#   CONTACT_FORWARD_TO    - email address contact form submissions are forwarded to
#   ASSESSMENT_FORWARD_TO - sales inbox for gap-assessment results (falls back to CONTACT_FORWARD_TO)
#   CONTACT_FROM          - sender address (must be on a domain verified as a
#                            SENDING domain in Resend — see src/lib/email.ts)
#   RESEND_API_KEY        - Resend API key, used to send contact/assessment mail
#   TURNSTILE_SECRET      - Cloudflare Turnstile secret key (for spam protection)
# The public Turnstile site key goes in PUBLIC_TURNSTILE_SITE_KEY (PUBLIC_ prefix exposes it to client code).
# Both CONTACT_FORWARD_TO and ASSESSMENT_FORWARD_TO should be set to
# hello@askalltech.com (shared inbox).
#
# Contact/assessment mail is sent via Resend's REST API (src/lib/email.ts),
# not Cloudflare's own "Send Email" Worker binding. That binding's
# destination-address verification requires Cloudflare Email Routing, which
# in turn requires taking over the domain's MX records — askalltech.com's MX
# is already Cloudflare Email Security, fronting the real company mailbox
# (Microsoft 365), and replacing it risked breaking live inbound mail. Resend
# only needs SPF/DKIM (TXT/CNAME) records to send as askalltech.com, which
# coexist with the existing MX setup untouched. No `[[send_email]]` binding
# is declared here as a result.
