name = "alltech-website"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
main = "./dist/_worker.js/index.js"

routes = [
  { pattern = "development-preview.askalltech.com", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"

# Plain (non-secret) runtime vars — committed here rather than set only via
# the dashboard because Workers Builds re-deploys the script fresh from this
# repo on every push, and dashboard-added `vars` (unlike Secrets, which are
# stored separately and do persist) get wiped on the next deploy unless
# they're declared in this file. Confirmed the hard way: these three
# vanished from "Runtime variables and secrets" after a redeploy while
# RESEND_API_KEY and TURNSTILE_SECRET (real Secrets) survived it fine.
[vars]
CONTACT_FORWARD_TO = "hello@askalltech.com"
ASSESSMENT_FORWARD_TO = "hello@askalltech.com"
CONTACT_FROM = "noreply@mail.askalltech.com"

# Secrets — set via the dashboard (Settings → Runtime variables and secrets),
# NOT committed here, and NOT reset by a redeploy the way plain vars are:
#   RESEND_API_KEY        - Resend API key, used to send contact/assessment mail
#   TURNSTILE_SECRET      - Cloudflare Turnstile secret key (for spam protection)
# The public Turnstile site key is a BUILD-time var, not a runtime one — it's
# read via import.meta.env.PUBLIC_TURNSTILE_SITE_KEY (Vite bakes it into the
# compiled output at `astro build` time), so it must be set under
# Settings → Builds → Variables and secrets instead, and requires a rebuild
# (not just a redeploy) to take effect after it's added.
#
# Contact/assessment mail is sent via Resend's REST API (src/lib/email.ts),
# not Cloudflare's own "Send Email" Worker binding. That binding's
# destination-address verification requires Cloudflare Email Routing, which
# in turn requires taking over the domain's MX records — askalltech.com's MX
# is already Cloudflare Email Security, fronting the real company mailbox
# (Microsoft 365), and replacing it risked breaking live inbound mail. Resend
# only needs SPF/DKIM (TXT/CNAME) records to send as askalltech.com, which
# coexist with the existing MX setup untouched. No `[[send_email]]` binding
# is declared here as a result.
